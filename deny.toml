[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# nv-redfish 0.13.0 pins quick-xml 0.38.4 only in its CSDL build compiler.
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (both patched in quick-xml >= 0.41.0)
# cannot process runtime, device, or user-controlled XML: the compiler parses
# only the trusted CSDL shipped inside the nv-redfish crate itself, and
# csdl-compiler never calls NsReader. D1 assessed the actual risk as low
# (build-time only, trusted input), so they are ignored -- but each entry
# carries its own trigger note naming the distinct DoS class: delete the
# entry and upgrade nv-redfish once upstream ships a csdl-compiler with
# quick-xml >= 0.41.0.
# RUSTSEC-2026-0235: rkyv is an unactivated optional dependency of
# rust_decimal -- never compiled and absent from the cargo-deny graph
# (`cargo tree --workspace --target all -i rkyv` prints nothing) -- so this
# [advisories] list does not need it. It IS registered in the ci.yml Advisory
# scan (cargo audit) ignore list, which flags lockfile-resident crates.
# Lockstep convention, both directions: keep [advisories] ignore here and the
# audit --ignore flags in .github/workflows/ci.yml in sync -- TRIGGER notes,
# drop dates, and the 0235 split are mirrored on the ci.yml side.
# RUSTSEC-2024-0436: informational unmaintained; no fixed release; the
# leptos 0.9 migration will resolve it.
# RUSTSEC-2026-0173: same family as RUSTSEC-2024-0436 (informational
# unmaintained, no fixed release); also resolved by the leptos 0.9 migration.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
    { id = "RUSTSEC-2026-0194", reason = "TRIGGER: delete this entry and upgrade nv-redfish once upstream csdl-compiler accepts quick-xml >= 0.41.0. 仅构建期解析 crate 自带受信 CSDL，重复属性 DoS 不可被外部输入触发 -- the build compiler parses only the trusted CSDL shipped inside the nv-redfish crate; the duplicate-attribute quadratic DoS of quick-xml < 0.41 (RUSTSEC-2026-0194) can only be triggered by external input (D1: actual risk low)." },
    { id = "RUSTSEC-2026-0195", reason = "TRIGGER: delete this entry and upgrade nv-redfish once upstream csdl-compiler accepts quick-xml >= 0.41.0. 仅构建期解析 crate 自带受信 CSDL，命名空间声明内存耗尽 DoS 不可被外部输入触发 -- same build-time-only exposure as RUSTSEC-2026-0194 but a distinct DoS class: the unbounded namespace-declaration allocation lives in NsReader, which csdl-compiler never calls (D1: actual risk low)." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.95
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-workspace = true
deny = [
    { crate = "lapin", reason = "Rutilus does not use an external message broker" },
    { crate = "native-tls", reason = "Rutilus uses rustls for TLS" },
    { crate = "openssl", reason = "Rutilus has no OpenSSL runtime dependency" },
    { crate = "postgres", reason = "Rutilus uses embedded SQLite only" },
    { crate = "rdkafka", reason = "Rutilus does not use an external message broker" },
    { crate = "redis", reason = "Rutilus does not use an external cache or queue" },
    { crate = "tokio-postgres", reason = "Rutilus uses embedded SQLite only" },
]
skip = [
    { crate = "ahash@0.7.8", reason = "不可达（optional 图排除），可达即需复核: reachable only through rkyv 0.7.46, the unactivated optional dependency of rust_decimal 1.42.1 (the RUSTSEC-2026-0235 chain); absent from the cargo-deny graph on every [graph] target" },
    { crate = "ahash@0.8.12", reason = "不可达（optional 图排除），可达即需复核: reachable only through arrow-array/arrow-select 58.4.0, pulled by sea-orm's unactivated arrow feature (sea-orm-arrow 2.0.0-rc.4); absent from the cargo-deny graph on every [graph] target" },
    { crate = "block-buffer@0.10.4", reason = "SQLx 0.9 and the audited encryption stack use different digest generations" },
    { crate = "convert_case@0.6.0", reason = "Leptos configuration and current Leptos macros use incompatible case-conversion generations" },
    { crate = "cpufeatures@0.2.17", reason = "SQLx 0.9 SHA-2 and the audited encryption stack use different digest generations" },
    { crate = "crypto-common@0.1.6", reason = "SQLx 0.9 SHA-2 and the audited encryption stack use different digest generations" },
    { crate = "digest@0.10.7", reason = "SQLx 0.9 and the audited digest stack (argon2, chacha20poly1305) use different digest generations; hmac/sha1 (TOTP) resolve the 0.11 generation already present for SQLx" },
    { crate = "foldhash@0.1.5", reason = "prost-build's petgraph resolves hashbrown 0.15 (foldhash 0.1) while the 0.16/0.17 generations (foldhash 0.2) come from SQLx's hashlink and petgraph's own indexmap; this is build-time only" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17 uses its audited legacy RNG API while Rutilus and UUID use getrandom 0.4" },
    { crate = "getrandom@0.3.4", reason = "不可达（optional 图排除），可达即需复核: reachable only through ahash 0.8.12 (the sea-orm-arrow chain above); absent from the cargo-deny graph on every [graph] target" },
    { crate = "hashbrown@0.12.3", reason = "不可达（optional 图排除），可达即需复核: reachable only through rkyv 0.7.46, the unactivated optional dependency of rust_decimal (the RUSTSEC-2026-0235 chain); absent from the cargo-deny graph. The reachable 0.17.1 (prost-build's petgraph -> indexmap) stays the unsanctioned anchor version" },
    { crate = "hashbrown@0.15.5", reason = "prost-build's petgraph pins the 0.15 generation while SQLx's hashlink carries 0.16 and petgraph's own indexmap carries 0.17 (the graph anchor); this is build-time only" },
    { crate = "hashbrown@0.16.1", reason = "SQLx 0.9's hashlink resolves the 0.16 generation while the prost-build build chain carries 0.15 (skipped) and 0.17 (anchor)" },
    { crate = "heck@0.4.1", reason = "SeaORM 2.0 macros have not fully converged on heck 0.5" },
    { crate = "rand@0.10.2", reason = "不可达（optional 图排除），可达即需复核: reachable only through quinn-proto 0.11.16 (reqwest's unactivated http3 feature) and sqlx-postgres 0.9.0 (sqlx's unactivated mysql/postgres features); absent from the cargo-deny graph on every [graph] target" },
    { crate = "r-efi@5.3.0", reason = "不可达（optional 图排除），可达即需复核: uefi-target-only dependency of getrandom 0.3.4 ([target.'cfg(all(target_os = \"uefi\", getrandom_backend = \"efi_rng\"))']); no uefi target in [graph].targets" },
    { crate = "r-efi@6.0.0", reason = "不可达（optional 图排除），可达即需复核: uefi-target-only dependency of the reachable getrandom 0.4.3 ([target.'cfg(all(target_os = \"uefi\", getrandom_backend = \"efi_rng\"))']); no uefi target in [graph].targets" },
    { crate = "sha1@0.10.7", reason = "tokio-tungstenite 0.24 pins sha1 0.10 (via tungstenite 0.24, used by the app and test-support WebSocket stack) while rutilus-domain TOTP uses the 0.11 generation; the tokio-tungstenite 0.30 upgrade removes this" },
    { crate = "sha2@0.11.0", reason = "不可达（optional 图排除），可达即需复核: reachable only through sqlx-mysql/sqlx-postgres 0.9.0 (sqlx's unactivated mysql/postgres features; the workspace uses sqlx-sqlite); absent from the cargo-deny graph on every [graph] target" },
    { crate = "syn@2.0.119", reason = "URL/ICU macros have not fully converged on syn 3; this is build-time only" },
    { crate = "thiserror@1.0.69", reason = "Leptos server_fn still uses gloo-net's legacy error generation while Rutilus and current Leptos internals use thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "Leptos server_fn still uses gloo-net's legacy error generation while Rutilus and current Leptos internals use thiserror 2" },
    { crate = "toml@1.1.4", reason = "Leptos build configuration and nv-redfish's build-only CSDL compiler require incompatible TOML generations" },
    { crate = "toml_datetime@0.7.5", reason = "nv-redfish's build-only CSDL compiler and tagged-types macros use incompatible TOML generations" },
    { crate = "wasm-streams@0.5.0", reason = "Leptos server_fn and Reqwest currently use incompatible Web stream adapter generations" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 retains its audited Windows bindings while Tokio and the CLI use windows-sys 0.61" },
    { crate = "winnow@0.7.15", reason = "nv-redfish's build-only CSDL compiler and tagged-types macros use incompatible parser generations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
