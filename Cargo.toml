[workspace]
members = ["app", "domain", "entity", "migration", "persistence", "security"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.5", features = ["derive"] }
getrandom = "0.4.3"
rutilus-domain = { path = "domain", version = "0.1.0" }
rutilus-entity = { path = "entity", version = "0.1.0" }
rutilus-migration = { path = "migration", version = "0.1.0" }
sea-orm = { version = "2.0.1", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "with-time", "with-uuid"] }
sea-orm-migration = { version = "2.0.1", default-features = false, features = ["runtime-tokio", "sqlx-sqlite", "with-time", "with-uuid"] }
secrecy = "0.10.3"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v7"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
