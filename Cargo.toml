[workspace]
members = ["api", "app", "application", "center-protocol", "domain", "entity", "infra-redfish", "migration", "operation-engine", "persistence", "platform", "security", "test-support", "ui", "web"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio"] }
base32 = "0.5.1"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.5", features = ["derive"] }
console = { version = "0.16.4", default-features = false, features = ["std"] }
csv = "1.4.0"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
futures = "0.3.33"
getrandom = "0.4.3"
gloo-net = { version = "0.6.0", default-features = false, features = ["http", "json"] }
hmac = "0.13.0"
http-body-util = "0.1.4"
leptos = { version = "=0.8.20", default-features = false, features = ["csr"] }
nv-redfish = { version = "=0.13.0", default-features = false, features = ["bmc-http", "std-redfish", "oem-ami", "oem-dell", "oem-dell-attributes", "oem-delta", "oem-hpe", "oem-lenovo", "oem-liteon", "oem-nvidia", "oem-nvidia-cper", "oem-nvidia-fabrics", "oem-nvidia-power-management", "oem-nvidia-profiles", "oem-nvidia-security", "oem-supermicro"] }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rust-embed = { version = "=8.11.0", features = ["debug-embed", "deterministic-timestamps"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-webpki = { version = "0.103.13", default-features = false, features = ["alloc", "std"] }
rutilus-api = { path = "api", version = "0.1.0" }
rutilus-domain = { path = "domain", version = "0.1.0" }
rutilus-application = { path = "application", version = "0.1.0" }
rutilus-center-protocol = { path = "center-protocol", version = "0.1.0" }
rutilus-infra-redfish = { path = "infra-redfish", version = "0.1.0" }
rutilus-entity = { path = "entity", version = "0.1.0" }
rutilus-migration = { path = "migration", version = "0.1.0" }
rutilus-operation-engine = { path = "operation-engine", version = "0.1.0" }
rutilus-persistence = { path = "persistence", version = "0.1.0" }
rutilus-platform = { path = "platform", version = "0.1.0" }
rutilus-security = { path = "security", version = "0.1.0" }
rutilus-test-support = { path = "test-support", version = "0.1.0" }
rutilus-web = { path = "web", version = "0.1.0" }
sea-orm = { version = "2.0.1", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "with-time", "with-uuid"] }
sea-orm-migration = { version = "2.0.1", default-features = false, features = ["runtime-tokio", "sqlx-sqlite", "with-time", "with-uuid"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["set-header"] }
url = "2.5.8"
uuid = "1.24.0"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
webbrowser = { version = "1.2.4", features = ["hardened"] }
# Windows DPAPI (CryptProtectData) and SCM service registration for the
# platform crate's OS-backed secret store and system service support.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Services"] }
zeroize = "1.9.0"

# Deny (not forbid) so the platform crate can scope an `#![allow(unsafe_code)]`
# to its Windows FFI module while every other crate keeps its own source-level
# `#![forbid(unsafe_code)]`; Cargo members cannot override a workspace forbid.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
