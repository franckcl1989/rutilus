[package]
name = "rutilus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
console.workspace = true
# The WebSocket transport of the site-to-center connection (§15): the
# `WebSocketStream` Stream/Sink traits come from futures-util, re-exported
# by the workspace-pinned futures crate.
futures.workspace = true
# The Site posture's self-signed certificate generation and its rustls
# listener (TLS 1.3 only); rustls-webpki parses the served certificate for
# the key/certificate match check, and sha2 fingerprints the certificate.
rcgen.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
# The site-to-center wire protocol: frame codec, negotiation, and the
# heartbeat/reconnect constants the connection layer consumes.
rutilus-center-protocol.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
# The WebSocket transport of the site-to-center connection (§15): the same
# 0.24 line axum's `ws` feature would pull in, used directly because the
# center listener is a dedicated socket (no HTTP router) and the site side
# needs a WebSocket *client*, which axum does not provide.
tokio-tungstenite.workspace = true
# The §14.4 EventService stream adapter owns the gateway stream's
# `CancellationToken` (the gateway's open contract requires one); tokio-util
# is pinned once in [workspace.dependencies] (infra-redfish, which defines
# the gateway stream, resolves the same single version).
tokio-util.workspace = true
# The bounded-drain request timeout (N2-2): the console's handlers are
# capped at the same grace as the shutdown drain (`GRACEFUL_DRAIN_TIMEOUT`),
# so a slow request is aborted with a 408 instead of stalling the stop.
# The workspace feature base (set-header, used by the web crate) is merged
# with the timeout feature this crate needs.
tower-http = { workspace = true, features = ["timeout"] }
rutilus-application.workspace = true
rutilus-domain.workspace = true
rutilus-infra-redfish.workspace = true
rutilus-operation-engine.workspace = true
rutilus-persistence.workspace = true
rutilus-platform.workspace = true
rutilus-security.workspace = true
serde_json.workspace = true
rutilus-web.workspace = true
secrecy.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# §6.2 diagnostic logging: the runtime modules record operational failures
# through `tracing::error!`/`warn!` inside `#[instrument]` spans, and main.rs
# initializes the tracing-subscriber stderr subscriber (RUST_LOG-filtered;
# text by default, or newline-delimited JSON with `--log-format json`).
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v7"] }
webbrowser.workspace = true

[dev-dependencies]
# The upstream-baseline constant consumed by the version/log-format
# integration tests (the `rutilus version` second line), so their expected
# output derives from the same single sources as the binary itself.
rutilus-infra-redfish.workspace = true
rutilus-test-support.workspace = true
tokio.workspace = true
# The audit warm-up test injects a corrupt row with raw SQL through a
# separate connection, bypassing the store's validated append surface (the
# production path of the warm-up failure flag).
sea-orm.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# rustls-webpki is used only through the fully-qualified extern-prelude path
# `webpki::` (site_runtime.rs: the EndEntityCert key/certificate match check
# and the SiteTlsError source), which the machete AST scan does not
# attribute to the crate.
ignored = ["rustls-webpki"]
