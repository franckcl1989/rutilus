[package]
name = "rutilus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
console.workspace = true
# The WebSocket transport of the site-to-center connection (§15): the
# `WebSocketStream` Stream/Sink traits come from futures-util, re-exported
# by the workspace-pinned futures crate.
futures.workspace = true
# The Site posture's self-signed certificate generation and its rustls
# listener (TLS 1.3 only); rustls-webpki parses the served certificate for
# the key/certificate match check, and sha2 fingerprints the certificate.
rcgen.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
# The site-to-center wire protocol: frame codec, negotiation, and the
# heartbeat/reconnect constants the connection layer consumes.
rutilus-center-protocol.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
# The WebSocket transport of the site-to-center connection (§15): the same
# 0.24 line axum's `ws` feature would pull in, used directly because the
# center listener is a dedicated socket (no HTTP router) and the site side
# needs a WebSocket *client*, which axum does not provide.
tokio-tungstenite.workspace = true
# The §14.4 EventService stream adapter owns the gateway stream's
# `CancellationToken` (the gateway's open contract requires one); tokio-util
# is already pinned at the same version by infra-redfish, which defines the
# gateway stream.
tokio-util = { version = "0.7.19", default-features = false }
rutilus-application.workspace = true
rutilus-domain.workspace = true
rutilus-infra-redfish.workspace = true
rutilus-operation-engine.workspace = true
rutilus-persistence.workspace = true
rutilus-platform.workspace = true
rutilus-security.workspace = true
serde_json.workspace = true
rutilus-web.workspace = true
secrecy.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v7"] }
webbrowser.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
