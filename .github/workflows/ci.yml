# CI quality gates for the Rutilus multi-vendor Redfish management product.
#
# Mirrors §19.4 of redfish-management-product-final-design.md:
#
#   cargo fmt --check
#   cargo clippy --workspace --all-targets --all-features
#   cargo test
#   cargo nextest
#   cargo llvm-cov
#   cargo deny
#   cargo audit              <- standalone gate since 2026-08-12; its ignore
#                              list mirrors deny.toml [advisories] via CLI
#                              flags (cargo-audit reads only audit.toml)
#   cargo machete
#   跨平台 Build             <- 3-OS matrix + wasm32 UI artifact
#   Migration Test
#   Capability Ledger Check
#   Release Baseline Check
#
# The toolchain comes exclusively from rust-toolchain.toml (channel 1.97.1,
# components clippy + rustfmt); no version is hard-coded here.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default job runs the full gates; the other two platforms
          # verify the 跨平台 Build gate with a full compile plus the
          # cross-platform E2E suites (web/tests + app/tests/version.rs).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_default: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            is_default: false
          - os: macos-latest
            target: x86_64-apple-darwin
            is_default: false
            is_macos: true
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain reads rust-toolchain.toml (channel 1.97.1,
      # components clippy + rustfmt) and adds the per-OS host target plus
      # wasm32-unknown-unknown for the UI crate.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      # Build cache for cargo. Covers target/ (including the wasm target and
      # target/rutilus-tools, where the pinned wasm-bindgen-cli is installed)
      # and ~/.cargo; keyed by toolchain + Cargo.lock.
      - uses: swatinem/rust-cache@v2

      # §19.4 gate tools: the nextest runner, the llvm-cov coverage driver,
      # the machete unused-dependency scan, the cargo-audit scanner (0.22.2,
      # verified locally), and cargo-zigbuild (0.22.3, the version
      # install-action tracks; cross-links the aarch64 musl release build).
      # Prebuilt binaries; only the default job runs the gates they serve.
      - name: Install gate tools
        if: matrix.is_default
        uses: taiki-e/install-action@v2
        with:
          tools: cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7,cargo-machete@0.9.2,cargo-audit@0.22.2,cargo-zigbuild@0.22.3

      # §19.4: cargo fmt --check
      - name: Format
        run: cargo fmt --check

      # §19.4: cargo clippy --workspace --all-targets --all-features
      # [workspace.lints] in Cargo.toml already denies the whole lint set;
      # -D warnings is the backstop so no warning can enter main.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # §19.4: cargo test. --workspace is required because
      # default-members = ["app"] would skip every other crate; --locked pins
      # the committed Cargo.lock.
      - name: Test (full workspace)
        if: matrix.is_default
        run: cargo test --locked --workspace

      # Non-default platforms: full compile of every target (the 跨平台 Build
      # gate) plus the cross-platform E2E suites below.
      - name: Check (cross-platform build)
        if: ${{ !matrix.is_default }}
        run: cargo check --locked --workspace --all-targets

      # §0.9.0 跨平台 E2E: the platform-independent suites, run on the
      # windows/macos jobs (the ubuntu default job covers the whole workspace
      # in the Test step above). `-p rutilus-web` runs the nine web/tests
      # path suites plus the web crate's lib tests; every one of the nine
      # files is an in-memory fake with no sockets, subprocesses, timers, or
      # platform-specific code (verified file-by-file and run green on a
      # local Windows host, 2026-08-12). `--test version` is the app binary
      # smoke test. app/tests/mock_center_client.rs (loopback mTLS/WebSocket
      # center interop) is deliberately NOT run here: it opens real sockets
      # with handshake/negotiation timing, and the conservative rule for the
      # non-default jobs is to keep only deterministic, network-free suites.
      # --locked pins the committed Cargo.lock.
      - name: Test (cross-platform E2E suites)
        if: ${{ !matrix.is_default }}
        run: |
          cargo test --locked -p rutilus-web
          cargo test --locked -p rutilus --test version

      # §19.4: cargo nextest. The same workspace suite on the nextest runner
      # (per-test process isolation and leak detection); --locked pins the
      # committed Cargo.lock, and the runner binary comes from the install
      # step above. --test-threads 4 bounds the runner's parallelism: at the
      # default per-CPU concurrency the suite's HTTPS mock-server churn
      # exhausts Windows' ephemeral socket pool (WSA 10055, verified
      # 2026-08-12 on a 32-core machine); 4 is deterministic there and on CI,
      # where the gate only ever runs on ubuntu-latest anyway.
      - name: Test (nextest)
        if: matrix.is_default
        run: cargo nextest run --locked --workspace --test-threads 4

      # §19.4: cargo llvm-cov. Line coverage of the whole workspace with the
      # threshold set at 80% against the 90.14% measured locally on
      # 2026-08-12 (margin for platform variance: Windows-only cfg code is
      # not compiled on the ubuntu runner). The trailing `-- --test-threads 4`
      # bounds the test run exactly like the nextest gate above, for the same
      # mock-timeout determinism reason. llvm-tools-preview provides the
      # llvm-profdata/llvm-cov binaries cargo-llvm-cov drives.
      - name: Coverage (llvm-cov)
        if: matrix.is_default
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --locked --workspace --fail-under-lines 80 -- --test-threads 4

      # §19.4: cargo deny. Official cargo-deny action (pinned to the version
      # verified locally against deny.toml: `cargo deny check` -> all of
      # advisories/bans/licenses/sources ok). Advisories stay green via the
      # two quick-xml ignores (RUSTSEC-2026-0194/0195) whose trigger notes
      # gate the nv-redfish quick-xml 0.41+ upgrade, and bans stay green via
      # the sha1 0.10 skip (tokio-tungstenite 0.24); the action caches the
      # advisory database on top of swatinem/rust-cache above.
      - name: Deny checks
        uses: embarkstudios/cargo-deny-action@v2
        with:
          command: check
          version: 0.20.2

      # §19.4: cargo audit. Standalone gate enabled 2026-08-12. cargo-audit
      # reads only audit.toml — NOT deny.toml — so the [advisories] ignore
      # entries are mirrored here as CLI flags (verified with cargo-audit
      # 0.22.2: without them `--deny warnings` fails on RUSTSEC-2026-0194/0195
      # plus the two unmaintained warnings; with them it exits 0). Keep this
      # list in lockstep with deny.toml [advisories] ignore: the TRIGGER notes
      # there apply — drop RUSTSEC-2026-0194/0195 once upstream
      # csdl-compiler accepts quick-xml >= 0.41.0. RUSTSEC-2026-0235 (rkyv,
      # unactivated optional dep of rust_decimal) is the re-registration the
      # deny.toml comment anticipated when the gate went live.
      - name: Advisory scan (cargo audit)
        if: matrix.is_default
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0173

      # §19.4: cargo machete. Zero unused dependencies; the three entries in
      # the per-crate [package.metadata.cargo-machete] sections (api getrandom,
      # app rustls-webpki, center-protocol serde) are false positives, each
      # documented at the ignore site.
      - name: Unused deps check (machete)
        if: matrix.is_default
        run: cargo machete

      # §19.4: 跨平台 Build — wasm32 UI artifact. Commands mirror ui/README.md;
      # wasm-bindgen-cli must stay at 0.2.126, the exact workspace
      # wasm-bindgen version. Regeneration is deterministic, so the fresh
      # artifacts are diffed against the checked-in web/assets to prove the
      # generated files are up to date (verified byte-identical locally).
      - name: Build wasm32 UI artifact
        if: matrix.is_default
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked -p rutilus-ui --target wasm32-unknown-unknown --release
          cargo install wasm-bindgen-cli --version 0.2.126 --locked --root target/rutilus-tools
          target/rutilus-tools/bin/wasm-bindgen --target web --no-typescript \
            --out-dir target/wasm-assets --out-name rutilus_ui \
            target/wasm32-unknown-unknown/release/rutilus_ui.wasm
          diff -q target/wasm-assets/rutilus_ui.js web/assets/rutilus_ui.js
          diff -q target/wasm-assets/rutilus_ui_bg.wasm web/assets/rutilus_ui_bg.wasm

      # §5.4: Release build — static musl binary. The Linux release target in
      # the §5.2 platform matrix is x86_64-unknown-linux-musl (static link per
      # §5.3: no dependency on the host glibc version), which the gnu check
      # above never exercises: ring and libsqlite3-sys (via sqlx-sqlite)
      # compile C code with the musl-gcc cross linker, so musl-specific build
      # errors would pass the gnu gate. `-p rutilus` builds just the app
      # binary, the only artifact the release ships; --locked pins the
      # committed Cargo.lock.
      - name: Build linux release binary (musl static)
        if: matrix.is_default
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked -p rutilus --target x86_64-unknown-linux-musl --release

      # §5.2 release matrix — aarch64. Same app-only release build as above,
      # cross-linked with cargo-zigbuild (zig's bundled linker; installed in
      # the gate-tools step): the standard way to target
      # aarch64-unknown-linux-musl from an x86_64 GitHub runner without a
      # musl-cross toolchain.
      - name: Build linux release binary (aarch64 musl static)
        if: matrix.is_default
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo zigbuild --locked -p rutilus --target aarch64-unknown-linux-musl --release

      # §5.2 release matrix — aarch64-pc-windows-msvc is deliberately NOT in
      # CI. Cross-compiling it on the x64 windows-latest runner needs the
      # ARM64 MSVC linker (link.exe) plus the ARM64 SDK import libraries,
      # which the hosted Windows images do not reliably provide; a build-only
      # step with an unverified toolchain is worse than none (真实有效原则).
      # Revisit with a native ARM64 Windows runner or after the toolchain is
      # verified on a local Windows ARM64 host. The x64 Windows job above
      # still compiles x86_64-pc-windows-msvc.
      #
      # §5.2 release matrix — macOS Universal 2. macos-latest is an arm64
      # runner: aarch64-apple-darwin builds natively, and rustc
      # cross-compiles x86_64-apple-darwin from the same toolchain (no
      # Rosetta involved — rustup supplies the target std and the Xcode
      # clang links both architectures, so the build never executes an
      # x86_64 binary). lipo (Xcode CLT, always present on the hosted
      # macOS images) merges the two release binaries into the single fat
      # binary §5.2 ships.
      - name: Build macOS Universal 2 release binary
        if: matrix.is_macos
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked -p rutilus --target aarch64-apple-darwin --release
          cargo build --locked -p rutilus --target x86_64-apple-darwin --release
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/rutilus \
            target/aarch64-apple-darwin/release/rutilus \
            target/x86_64-apple-darwin/release/rutilus

      # §19.4: Migration Test. Also covered by the full workspace test above;
      # kept as an explicit gate for visibility (migration/tests/initial_storage.rs).
      - name: Migration test
        if: matrix.is_default
        run: cargo test --locked -p rutilus-migration

      # §19.4: Capability Ledger Check. Asserts the compiled nv-redfish
      # baseline (version 0.13.0, std-redfish, 14 OEM feature groups) in
      # infra-redfish/src/lib.rs::links_the_complete_development_capability_surface.
      - name: Capability ledger check
        if: matrix.is_default
        run: cargo test --locked -p rutilus-infra-redfish

      # §2.3: Release Baseline Check. Runs the frozen 0.8.0 release-baseline
      # gates in infra-redfish/src/release_baseline.rs (the `release_baseline`
      # test filter): the frozen version must match the pinned manifest and
      # Cargo.lock, the feature inventory must equal the workspace manifests
      # bidirectionally, every public module must be classified with a product
      # decision and match the vendored nv-redfish src/lib.rs, the schema
      # versions must match Cargo.lock, and the capability-ledger hash
      # snapshot must equal the §15.3 negotiation golden.
      - name: Release baseline check
        if: matrix.is_default
        run: cargo test --locked -p rutilus-infra-redfish release_baseline
