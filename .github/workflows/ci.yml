# CI quality gates for the Rutilus multi-vendor Redfish management product.
#
# Mirrors §19.4 of redfish-management-product-final-design.md:
#
#   cargo fmt --check
#   cargo clippy --workspace --all-targets --all-features
#   cargo test
#   cargo nextest
#   cargo llvm-cov
#   cargo deny
#   cargo audit              <- standalone gate since 2026-08-12; its ignore
#                              list mirrors deny.toml [advisories] via CLI
#                              flags (cargo-audit reads only audit.toml)
#   cargo machete
#   secret-leak gate          <- 2026-08-12; repo-level half of the security
#                              review §4.3 follow-up, beyond the frozen §19.4
#                              list (security/tests/secret_leak_gate.rs)
#   跨平台 Build             <- 3-OS matrix + wasm32 UI artifact
#   Migration Test
#   Capability Ledger Check
#   Release Baseline Check
#
# The toolchain comes exclusively from rust-toolchain.toml (channel 1.97.1,
# components clippy + rustfmt); no version is hard-coded here.
#
# Repository self-protection (W6-2, 2026-08-13): .github/CODEOWNERS requires
# explicit review for every change under .github/, including this workflow.
# Branch protection is the stronger line of defense and lives OUTSIDE the
# repository (repository settings are not version-controlled) — CODEOWNERS
# is the in-repo mitigation so workflow changes still land in a reviewable
# pull request even if those settings are ever loosened or the repo moves.
#
# Third-party action pinning (supply-chain, F4-1, 2026-08-13): every external
# action below is pinned to the full commit SHA of the tag it tracks, with
# the tag noted inline on the `uses:` line. A moving or rewritten tag can
# then no longer inject a new action revision into a run without an explicit
# PR. .github/dependabot.yml opens weekly PRs to bump the pins (github-actions
# ecosystem), and every such PR touches .github/ so CODEOWNERS review applies.
# Trade-off, stated honestly: pinning freezes the action at that commit until
# the bump lands, so security fixes to an action arrive via the Dependabot
# bump, not silently. Toolchain choice is NOT pinned here — it comes
# exclusively from rust-toolchain.toml (channel 1.97.1), so the
# dtolnay/rust-toolchain pin freezes only the action's own revision, not the
# compiler.

name: CI

on:
  push:
    branches: [main, master]
    # §5.4 / 1.0.0 condition 17: a `v*` tag push builds the release artifacts
    # (signing + SBOM + SHA-256) in the release-artifacts job below. The ci
    # job above re-runs the full quality gates on tag pushes too —
    # intentional: the final check before a release, and `v*` tags are only
    # ever cut from a gate-green main.
    tags: ['v*']
  pull_request:
  # Manual release-artifact build (same gates-first order, via
  # `needs: ci` on the release-artifacts job).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # §5.4 build-result embedding: the git commit of the built tree,
      # injected at the job level so every build and test step derives the
      # same value — the version/log-format integration tests assert the
      # binary's `git commit` line equals their own compile-time
      # RUTILUS_GIT_COMMIT, so any inconsistency between steps would fail
      # the suite. `github.sha` is the exact commit actions/checkout
      # checked out (the merge commit on pull_request events), so the
      # embedded commit is the tree being built; the app falls back to
      # `dev` when the variable is absent (local builds, no git
      # subprocess).
      RUTILUS_GIT_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default job runs the full gates; the other two platforms
          # verify the 跨平台 Build gate with a full compile plus the
          # cross-platform E2E suites (web/tests + app/tests/version.rs).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_default: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            is_default: false
          - os: macos-latest
            target: x86_64-apple-darwin
            is_default: false
            is_macos: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # tag v4

      # dtolnay/rust-toolchain reads rust-toolchain.toml (channel 1.97.1,
      # components clippy + rustfmt) and adds the per-OS host target plus
      # wasm32-unknown-unknown for the UI crate.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # tag stable (moving; pinned 2026-08-05)
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      # Build cache for cargo. Covers target/ (including the wasm target and
      # target/rutilus-tools, where the pinned wasm-bindgen-cli is installed)
      # and ~/.cargo; keyed by toolchain + Cargo.lock.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # tag v2 (2.9.2)

      # §19.4 gate tools: the nextest runner, the llvm-cov coverage driver,
      # the machete unused-dependency scan, the cargo-audit scanner (0.22.2,
      # verified locally), and the cargo-zigbuild driver (0.22.3, the
      # version install-action tracks; the Zig compiler itself is installed
      # separately below for the aarch64 musl release build).
      # Prebuilt binaries; only the default job runs the gates they serve.
      #
      # The input is `tool` (singular): `tools` is not — and never was — a
      # declared input of install-action (every tagged action.yml from
      # v1.0.0 to v2.0.0 declares only `tool`), and GitHub Actions silently
      # ignores undeclared inputs: the first CI run's `Test (nextest)` failed
      # with "no such command: `nextest`" (2026-08-13, run 31671112310)
      # precisely because the `tools:` key installed nothing. Comma-separated
      # list and per-tool pins unchanged.
      - name: Install gate tools
        if: matrix.is_default
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20  # tag v2 (2.85.12)
        with:
          tool: cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7,cargo-machete@0.9.2,cargo-audit@0.22.2,cargo-zigbuild@0.22.3

      # cargo-zigbuild is a Cargo driver, not a Zig distribution. Pin the
      # compiler independently so the cross-link never depends on runner
      # image contents (CI run 31869796071 failed with "Failed to find zig").
      - name: Install Zig compiler (aarch64)
        if: matrix.is_default
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # tag v2.2.1
        with:
          version: 0.14.1

      # §19.4: cargo fmt --check
      - name: Format
        run: cargo fmt --check

      # §19.4: cargo clippy --workspace --all-targets --all-features
      # [workspace.lints] in Cargo.toml already denies the whole lint set;
      # -D warnings is the backstop so no warning can enter main.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # §19.4: cargo test. --workspace is required because
      # default-members = ["app"] would skip every other crate; --locked pins
      # the committed Cargo.lock.
      #
      # R6-W-8 ran-assertion (2026-08-14): the step now runs through
      # scripts/assert-tests-ran.sh with pin 1913 — the master-measured
      # count at HEAD e85560a (`cargo test --locked --workspace -- --list`:
      # lib/integration 1912 + doc 1 = 1913, matching the 2026-08-14 门禁复跑
      # in release-readiness.md §五; re-measured locally on the same commit).
      # W9-CI-2 re-sync (2026-08-14): the master-measured count is now 2036
      # (`cargo test --locked --workspace -- --list`, measured after the
      # wave-ten test additions; wave-nine had pushed it to 2029;
      # 2016 was a mid-landing intermediate, superseded at integration).
      # The pin stays at 1913 on purpose: floor semantics, not an exact
      # count — the step fails only when the total dips below the pin, and
      # the --expect-tests list (R6-W-7) anchors six gate-critical names
      # across six crates, so a deleted or cfg-emptied suite fails even
      # when the remaining count still clears the floor (see the Migration
      # step comment below for the same floor explanation). The pin is the
      # point-in-time lower bound, not a growth tracker — re-measure at
      # integration.
      - name: Test (full workspace)
        if: matrix.is_default
        run: bash scripts/assert-tests-ran.sh 1913 --expect-tests version_reports_product_and_upstream_baseline,json_log_format_is_accepted_and_keeps_user_visible_output,refresh_capture_flows_into_the_diagnostics_response,links_the_complete_development_capability_surface,migration_down_drops_children_before_parents,workspace_sources_have_no_hardcoded_secrets_or_plaintext_disclosure --locked --workspace

      # Non-default platforms: full compile of every target (the 跨平台 Build
      # gate) plus the cross-platform E2E suites below.
      - name: Check (cross-platform build)
        if: ${{ !matrix.is_default }}
        run: cargo check --locked --workspace --all-targets

      # §0.9.0 跨平台 E2E: the platform-independent suites, run on the
      # windows/macos jobs (the ubuntu default job covers the whole workspace
      # in the Test step above). `-p rutilus-web` runs the nine web/tests
      # path suites plus the web crate's lib tests; every one of the nine
      # files is an in-memory fake with no sockets, subprocesses, timers, or
      # platform-specific code (verified file-by-file and run green on a
      # local Windows host, 2026-08-12). `--test version` is the app binary
      # smoke test. app/tests/mock_center_client.rs (loopback mTLS/WebSocket
      # center interop) is deliberately NOT run here: it opens real sockets
      # with handshake/negotiation timing, and the conservative rule for the
      # non-default jobs is to keep only deterministic, network-free suites.
      # --locked pins the committed Cargo.lock.
      - name: Test (cross-platform E2E suites)
        if: ${{ !matrix.is_default }}
        run: |
          cargo test --locked -p rutilus-web
          cargo test --locked -p rutilus --test version

      # §19.4: cargo nextest. The same workspace suite on the nextest runner
      # (per-test process isolation and leak detection); --locked pins the
      # committed Cargo.lock, and the runner binary comes from the install
      # step above. --test-threads 4 bounds the runner's parallelism: at the
      # default per-CPU concurrency the suite's HTTPS mock-server churn
      # exhausts Windows' ephemeral socket pool (WSA 10055, verified
      # 2026-08-12 on a 32-core machine); 4 is deterministic there and on CI,
      # where the gate only ever runs on ubuntu-latest anyway.
      - name: Test (nextest)
        if: matrix.is_default
        run: cargo nextest run --locked --workspace --test-threads 4

      # §19.4: cargo llvm-cov. Line coverage of the whole workspace with the
      # threshold set at 80% against the 90.14% measured locally on
      # 2026-08-12 (margin for platform variance: Windows-only cfg code is
      # not compiled on the ubuntu runner). The trailing `-- --test-threads 4`
      # bounds the test run exactly like the nextest gate above, for the same
      # mock-timeout determinism reason. llvm-tools-preview provides the
      # llvm-profdata/llvm-cov binaries cargo-llvm-cov drives.
      - name: Coverage (llvm-cov)
        if: matrix.is_default
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --locked --workspace --fail-under-lines 80 -- --test-threads 4

      # §19.4: cargo deny. Official cargo-deny action (the v2 tag pins its
      # own cargo-deny binary; deny.toml compatibility was verified locally
      # with cargo-deny 0.20.2: `cargo deny check` -> all of
      # advisories/bans/licenses/sources ok). Advisories stay green via the
      # two quick-xml ignores (RUSTSEC-2026-0194/0195) whose trigger notes
      # gate the nv-redfish quick-xml 0.41+ upgrade, and bans stay green via
      # the sha1 0.10 skip (tokio-tungstenite 0.24). The action is a Docker
      # container action with no cache step (verified against its action.yml,
      # 2026-08-13): GitHub runs Docker container actions only on Linux
      # runners ("Container action is only supported on Linux"), so the step
      # is gated `if: matrix.is_default` and runs on the ubuntu job alone.
      # The earlier `version: 0.20.2` input was dropped — the v2 action has
      # no version input (it builds the cargo-deny pinned by its own tag);
      # the action's valid inputs are checked on every run, and the CI first
      # run's "Unexpected input(s) 'version'" warning is what caught it. The
      # advisory database is fetched fresh on every run, and the
      # swatinem/rust-cache step above caches only cargo registry/build
      # artifacts under a ref-scoped key — no advisory-database reuse and no
      # cache pollution surface between runs either way.
      # R6-8 (2026-08-14): `command-arguments: --deny warnings` turns every
      # cargo-deny lint warning into a failure. The trigger exists because the
      # eight formerly-skipped crates (ahash@0.7.8/0.8.12, getrandom@0.3.4,
      # hashbrown@0.12.3, rand@0.10.2, r-efi@5.3.0/6.0.0, sha2@0.11.0) were
      # verified unreachable and their skip entries deleted from deny.toml —
      # with only `command: check` a silently-stale skip entry (or any other
      # new warning) would go green. The flag is passed via command-arguments
      # (after the `check` subcommand) because `--deny warnings` is a check
      # option, while the action's `arguments` input lands BEFORE the command;
      # the action's Dockerfile pins cargo-deny 0.20.2, the exact version
      # verified locally (`cargo deny --all-features check --deny warnings`
      # -> all ok, exit 0). Note the flag spelling: `--deny warnings`, not
      # `--deny-warnings` — 0.20.2 has no --deny-warnings flag.
      - name: Deny checks
        if: matrix.is_default
        uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # tag v2
        with:
          command: check
          command-arguments: --deny warnings

      # §19.4: cargo audit. Standalone gate enabled 2026-08-12. cargo-audit
      # reads only audit.toml — NOT deny.toml — so the [advisories] ignore
      # entries are mirrored here as CLI flags (verified with cargo-audit
      # 0.22.2: without them `--deny warnings` fails on RUSTSEC-2026-0194/0195
      # plus the two unmaintained warnings; with them it exits 0). Keep this
      # list in lockstep with deny.toml [advisories] ignore — the convention
      # runs both directions (deny.toml's [advisories] comment points back
      # here): the TRIGGER notes in deny.toml apply — drop
      # RUSTSEC-2026-0194/0195 once upstream csdl-compiler accepts
      # quick-xml >= 0.41.0. RUSTSEC-2026-0235 (rkyv, unactivated optional
      # dep of rust_decimal) lives ONLY in this list, not in deny.toml: the
      # cargo-deny graph never sees rkyv, while cargo-audit reports the
      # lockfile-resident version — this entry is the registered re-registration
      # the deny.toml comment anticipated when the gate went live, and it
      # stays here as long as the rust_decimal dependency exists.
      - name: Advisory scan (cargo audit)
        if: matrix.is_default
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0173

      # §19.4: cargo machete. Zero unused dependencies; the three entries in
      # the per-crate [package.metadata.cargo-machete] sections (api getrandom,
      # app rustls-webpki, center-protocol serde) are false positives, each
      # documented at the ignore site.
      - name: Unused deps check (machete)
        if: matrix.is_default
        run: cargo machete

      # W11-T-1 (2026-08-14): cross-document anchor gate — the docs carry
      # hundreds of `file:line` references into the code tree, and ten
      # adversarial-audit rounds showed that manual re-anchor passes miss
      # a class of references every time (the wave-six ci.yml shift drifted
      # ~+98 anchors that went five rounds unnoticed). The gate fails when
      # a referenced range falls outside its file (hard tier) and lists
      # fingerprint misses for review; bare `:NNN` continuation refs
      # inherit the nearest path mention on their line (W11-T-2). Blind
      # spots (token-sharing drift, wrong-path inheritance) are registered
      # in the script header.
      - name: Doc anchor gate
        if: matrix.is_default
        run: bash scripts/check-doc-anchors.sh docs

      # §10 / §16.3 secret-leak gate — the repository-level half of the
      # security review's §4.3 follow-up (独立 Secret 泄漏扫描): a token-wise
      # scan of every workspace src/ and tests/ .rs file (crate directories
      # discovered relative to CARGO_MANIFEST_DIR, so new crates are covered
      # automatically) that fails on hardcoded secrets ([R1]), embedded PEM
      # private-key material ([R2]), and plaintext credential disclosure in
      # output macros ([R3]); test-scope code is exempt by context, not by
      # value allow-lists (security/tests/secret_leak_gate.rs). The runtime
      # half (log/response review) stays with the release review. --locked
      # pins the committed Cargo.lock.
      #
      # W6-1 ran-assertion (2026-08-13): scripts/assert-tests-ran.sh fails
      # the step unless the number of tests that actually ran and passed
      # is >= 10. The pin is the master-measured count (2026-08-13 gate
      # re-run: `cargo test --locked -p rutilus-security --test
      # secret_leak_gate` reports 15 passed — the 4 workspace-scan tests
      # plus the 11 rule-matrix/hardening tests of
      # security/tests/secret_leak_gate.rs; wave-six added the five
      # tokenizer/PEM hardening tests). Floor semantics, not exact
      # count: the step fails only when the count dips below the pin —
      # deleting the file, #[ignore]-ing its tests, or cfg-emptying them
      # drops it to 0 and fails, while a partial reduction that still
      # leaves >= 10 passing tests passes. The pin is the lower bound of
      # the measured baseline; the test total grows with the product.
      - name: Secret leak gate
        if: matrix.is_default
        run: bash scripts/assert-tests-ran.sh 10 --expect-tests workspace_sources_have_no_hardcoded_secrets_or_plaintext_disclosure,workspace_scan_is_deterministic,workspace_scan_covers_the_expected_source_population,crate_scan_includes_build_scripts --locked -p rutilus-security --test secret_leak_gate

      # §19.4: wasm32 UI artifact freshness gate. The web console serves the
      # checked-in web/assets files directly, so CI proves on every push that
      # the current source regenerates them. Cross-host byte equality needs
      # three ingredients, each the conclusion of a real CI failure:
      # (1) the wasm-bindgen CLI is the official prebuilt binary (SHA-pinned),
      #     one binary on every host — cargo-installing from source produced
      #     per-host binaries whose closure-function ordering differs, and no
      #     normalization can fix an ordering difference;
      # (2) RUSTFLAGS remaps $HOME and the checkout dir so build-host paths
      #     never reach the data segment (path disclosure + reproducibility);
      # (3) the comparison normalizes the remaining host classes (path
      #     separators, the toolchain triple) in the wasm pair.
      - name: Build wasm32 UI artifact
        id: build-wasm32-ui
        if: matrix.is_default
        run: |
          rustup target add wasm32-unknown-unknown
          # rust-src keeps the std panic locations in the local sysroot form
          # instead of /rustc/<hash>/library/... (a host-independent class).
          rustup component add rust-src \
            --toolchain "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          curl -L --fail \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-bindgen.tgz
          echo "064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d  /tmp/wasm-bindgen.tgz" | sha256sum -c -
          mkdir -p target/rutilus-tools
          tar -xzf /tmp/wasm-bindgen.tgz -C target/rutilus-tools --strip-components=1
          RUSTFLAGS="--remap-path-prefix=$HOME=.cargo-home --remap-path-prefix=$PWD=." \
            cargo build --locked -p rutilus-ui --target wasm32-unknown-unknown --release
          target/rutilus-tools/wasm-bindgen --target web --no-typescript \
            --out-dir target/wasm-assets --out-name rutilus_ui \
            target/wasm32-unknown-unknown/release/rutilus_ui.wasm
          mkdir -p target/wasm-compare
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' \
            target/wasm-assets/rutilus_ui.js > target/wasm-compare/generated-rutilus_ui.js
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' \
            web/assets/rutilus_ui.js > target/wasm-compare/committed-rutilus_ui.js
          # Normalize the registered host-path classes in the wasm pair
          # (.cargo-home segments, ui\src / ui/src prefixes, the host
          # toolchain triple) before the byte comparison; anything outside
          # the classes still fails the gate.
          python3 - <<'PYEOF'
          import re
          def normalize(src, dst):
              data = open(src, 'rb').read()
              out = []
              for seg in data.split(b'\x00'):
                  if b'.cargo-home' in seg or seg.startswith(b'ui\\src') or seg.startswith(b'ui/src'):
                      seg = seg.replace(b'\\', b'/')
                      seg = re.sub(rb'1\.97\.1-[^/]*', b'1.97.1-toolchain', seg)
                  out.append(seg)
              open(dst, 'wb').write(b'\x00'.join(out))
          normalize('target/wasm-assets/rutilus_ui_bg.wasm', 'target/wasm-compare/generated-rutilus_ui_bg.wasm')
          normalize('web/assets/rutilus_ui_bg.wasm', 'target/wasm-compare/committed-rutilus_ui_bg.wasm')
          PYEOF
          if diff -q target/wasm-compare/generated-rutilus_ui.js target/wasm-compare/committed-rutilus_ui.js \
              && diff -q target/wasm-compare/generated-rutilus_ui_bg.wasm target/wasm-compare/committed-rutilus_ui_bg.wasm; then
            echo "wasm UI artifacts match the checked-in files"
          else
            echo "wasm UI artifacts DIFFER from the checked-in files"
            # Bash-only forensics: sizes, sha256s, first differing bytes of
            # each pair, and the string-set diff of the two wasm sides.
            for f in target/wasm-compare/generated-rutilus_ui.js target/wasm-compare/committed-rutilus_ui.js \
                     target/wasm-compare/generated-rutilus_ui_bg.wasm target/wasm-compare/committed-rutilus_ui_bg.wasm; do
              echo "$f: $(wc -c < "$f") bytes, sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            done
            for pair in "js target/wasm-compare/generated-rutilus_ui.js target/wasm-compare/committed-rutilus_ui.js" \
                        "wasm target/wasm-compare/generated-rutilus_ui_bg.wasm target/wasm-compare/committed-rutilus_ui_bg.wasm"; do
              set -- $pair; name="$1"; a="$2"; b="$3"
              echo "$name first differing bytes (offset byte-a byte-b, octal):"
              cmp -l "$a" "$b" 2>/dev/null | head -6 || echo "  (no common prefix)"
              off=$(cmp "$a" "$b" 2>&1 | sed -n 's/.*differ: byte \([0-9][0-9]*\).*/\1/p')
              if [ -n "$off" ]; then
                start=$((off > 32 ? off - 32 : 1))
                echo "  generated @byte $start: $(dd if="$a" bs=1 skip=$((start - 1)) count=96 2>/dev/null | tr -c '[:print:]' '.')"
                echo "  committed @byte $start: $(dd if="$b" bs=1 skip=$((start - 1)) count=96 2>/dev/null | tr -c '[:print:]' '.')"
              fi
            done
            echo "embedded string sets, committed-only lines (<) and generated-only lines (>):"
            strings -a target/wasm-compare/committed-rutilus_ui_bg.wasm | sort -u > target/wasm-compare/com-strings.txt
            strings -a target/wasm-compare/generated-rutilus_ui_bg.wasm | sort -u > target/wasm-compare/gen-strings.txt
            diff target/wasm-compare/com-strings.txt target/wasm-compare/gen-strings.txt | head -40 || true
            touch target/wasm-compare/mismatch.marker
            exit 1
          fi

      # On mismatch the CI-generated js+wasm are uploaded for a local diff.
      # The build step's output does not survive its failing exit, so the
      # upload gates on a marker file the mismatch branch touches.
      - name: Upload CI-generated wasm assets (diagnostics)
        if: ${{ always() && hashFiles('target/wasm-compare/mismatch.marker') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # tag v4
        with:
          name: wasm-assets-ci-generated-${{ github.run_id }}
          path: |
            target/wasm-compare/mismatch.marker
            target/wasm-assets/rutilus_ui.js
            target/wasm-assets/rutilus_ui_bg.wasm
          if-no-files-found: ignore
      # §5.4: Release build — static musl binary. The Linux release target in
      # the §5.2 platform matrix is x86_64-unknown-linux-musl (static link per
      # §5.3: no dependency on the host glibc version), which the gnu check
      # above never exercises: ring and libsqlite3-sys (via sqlx-sqlite)
      # compile C code with the musl-gcc cross linker, so musl-specific build
      # errors would pass the gnu gate. `-p rutilus` builds just the app
      # binary, the only artifact the release ships; --locked pins the
      # committed Cargo.lock.
      - name: Build linux release binary (musl static)
        if: matrix.is_default
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked -p rutilus --target x86_64-unknown-linux-musl --release

      # §5.2 release matrix — aarch64. Same app-only release build as above,
      # cross-linked with the cargo-zigbuild driver plus the separately
      # pinned Zig compiler: the standard way to target
      # aarch64-unknown-linux-musl from an x86_64 GitHub runner without a
      # musl-cross toolchain.
      - name: Build linux release binary (aarch64 musl static)
        if: matrix.is_default
        run: |
          rustup target add aarch64-unknown-linux-musl
          zig version
          cargo zigbuild --locked -p rutilus --target aarch64-unknown-linux-musl --release

      # §5.2 release matrix — aarch64-pc-windows-msvc is deliberately NOT in
      # CI. Cross-compiling it on the x64 windows-latest runner needs the
      # ARM64 MSVC linker (link.exe) plus the ARM64 SDK import libraries,
      # which the hosted Windows images do not reliably provide; a build-only
      # step with an unverified toolchain is worse than none (真实有效原则).
      # Revisit with a native ARM64 Windows runner or after the toolchain is
      # verified on a local Windows ARM64 host. The x64 Windows job above
      # still compiles x86_64-pc-windows-msvc.
      #
      # §5.2 release matrix — macOS Universal 2. macos-latest is an arm64
      # runner: aarch64-apple-darwin builds natively, and rustc
      # cross-compiles x86_64-apple-darwin from the same toolchain (no
      # Rosetta involved — rustup supplies the target std and the Xcode
      # clang links both architectures, so the build never executes an
      # x86_64 binary). lipo (Xcode CLT, always present on the hosted
      # macOS images) merges the two release binaries into the single fat
      # binary §5.2 ships.
      - name: Build macOS Universal 2 release binary
        if: matrix.is_macos
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked -p rutilus --target aarch64-apple-darwin --release
          cargo build --locked -p rutilus --target x86_64-apple-darwin --release
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/rutilus \
            target/aarch64-apple-darwin/release/rutilus \
            target/x86_64-apple-darwin/release/rutilus
          # Verify the merged artifact (audit A4): lipo -create cannot fail
          # on a thin output, so the §5.2 architectures are checked
          # explicitly — lipo -verify_arch exits non-zero when either is
          # missing, and lipo -info prints the fat-file banner for the log.
          # Syntax (man lipo): -verify_arch takes one input file and eats
          # EVERY argument after the flag as arch types — "all of the
          # input files must appear before the -verify_arch flag" — so the
          # binary goes first, not last. This step had never actually run
          # before: the gate tools were never installed (the install-action
          # input was `tools:` instead of `tool:`), so the macOS job died
          # earlier at the first nextest step; 31a4232 fixed the install
          # and run 31674299719 was the first real execution, exposing the
          # inverted argument order (lipo read the binary path as an arch
          # flag: "unknown architecture specification flag").
          lipo -info target/universal-apple-darwin/release/rutilus
          lipo target/universal-apple-darwin/release/rutilus -verify_arch x86_64 arm64

      # §19.4: Migration Test. Also covered by the full workspace test above;
      # kept as an explicit gate for visibility (migration/tests/initial_storage.rs).
      #
      # W6-1 ran-assertion (2026-08-13): scripts/assert-tests-ran.sh fails
      # the step unless the number of tests that actually ran and passed
      # is >= 50. The pin is the master-measured count (2026-08-14 gate
      # re-run, W9-T-3 re-sync: `cargo test --locked -p rutilus-migration
      # -- --list` reports 74 passed — 19 down_order_gate + 8 bare_sql_gate
      # + 44 other migration tests + 3 initial transaction round-trips).
      # Floor semantics, not
      # exact count: the step fails only when the count dips below the
      # pin — deleting a non-gate test file that still leaves 49 passing
      # tests passes, and only a dip below 50 (whole-suite deletion,
      # #[ignore], or cfg-emptying) fails. The pin is the lower bound of
      # the measured baseline; the test total grows with the product
      # (re-measured at wave-ten integration: 74 = 19 + 8 + 44 + 3).
      #
      # R6-W-7 (2026-08-14): the --expect-tests list adds a NAME-level
      # assertion on top of the count — six core down_order_gate test names
      # must appear as passed in the run output, so hollowing the gate
      # while keeping >= 50 other passing tests (the count floor's blind
      # spot) fails the step.
      - name: Migration test
        if: matrix.is_default
        run: bash scripts/assert-tests-ran.sh 50 --expect-tests migration_down_drops_children_before_parents,gate_rejects_parent_before_child_down,gate_accepts_child_before_parent_down,gate_checks_raw_sql_drop_order_in_down_body,gate_checks_builder_drops_in_helpers_outside_the_down_body,gate_rejects_unresolvable_drop_targets --locked -p rutilus-migration

      # Ran-assertion coverage (2026-08-14, R6-W-8): the
      # scripts/assert-tests-ran.sh gate now covers all five test-shaped
      # steps — the workspace Test step (pin 1913), the Secret leak gate
      # (pin 10), the Migration test (pin 50), the Capability ledger check
      # (pin 295), and the Release baseline check (pin 14) below — each
      # with an --expect-tests name list (R6-W-7). No default-job
      # test-shaped gate runs plain `cargo test` anymore (the windows/macos
      # cross-platform E2E step above stays plain by design: its suites are
      # covered by the ubuntu workspace run).

      # §19.4: Capability Ledger Check. Asserts the compiled nv-redfish
      # baseline (version 0.13.0, std-redfish, 14 OEM feature groups) in
      # infra-redfish/src/lib.rs::links_the_complete_development_capability_surface.
      #
      # R6-W-8 ran-assertion (2026-08-14): pin 295 is the locally measured
      # `cargo test --locked -p rutilus-infra-redfish -- --list` count at
      # HEAD e85560a (all lib unit tests; 0 doc-tests), matching the
      # per-crate 295 of the release-readiness.md §五 门禁复跑. The
      # --expect-tests names are the ledger's two own tests.
      - name: Capability ledger check
        if: matrix.is_default
        run: bash scripts/assert-tests-ran.sh 295 --expect-tests links_the_complete_development_capability_surface,compiled_oem_features_match_the_domain_oem_capabilities_exactly --locked -p rutilus-infra-redfish

      # §2.3: Release Baseline Check. Runs the frozen 0.8.0 release-baseline
      # gates in infra-redfish/src/release_baseline.rs (the `release_baseline`
      # test filter): the frozen version must match the pinned manifest and
      # Cargo.lock, the feature inventory must equal the workspace manifests
      # bidirectionally, every public module must be classified with a product
      # decision and match the vendored nv-redfish src/lib.rs, the schema
      # versions must match Cargo.lock, and the capability-ledger hash
      # snapshot must equal the §15.3 negotiation golden.
      #
      # R6-W-8 ran-assertion (2026-08-14): pin 14 is the locally measured
      # `cargo test --locked -p rutilus-infra-redfish release_baseline
      # -- --list` count at HEAD e85560a (the 14 release_baseline::tests
      # functions); the --expect-tests list anchors the six frozen-baseline
      # cores among them.
      - name: Release baseline check
        if: matrix.is_default
        run: bash scripts/assert-tests-ran.sh 14 --expect-tests release_baseline_version_matches_the_pinned_manifest,release_baseline_explicit_features_match_the_workspace_manifests_bidirectionally,release_baseline_every_module_is_classified_with_a_decision,release_baseline_ledger_hash_matches_the_negotiation_golden,release_baseline_module_inventory_matches_the_vendored_lib_rs,release_baseline_schema_versions_match_the_committed_lockfile --locked -p rutilus-infra-redfish release_baseline

  # ===========================================================================
  # §5.4 / 1.0.0 release condition 17: release artifacts — signed binaries,
  # SHA-256 manifest, and SBOM — built on `workflow_dispatch` or a `v*` tag
  # push.
  #
  # Conservative wiring:
  #  - The existing `ci` job is untouched; the trigger changes in `on:` above
  #    only broaden the event surface, and this job waits for `ci` (`needs`),
  #    so a release always runs the full quality gates first.
  #  - Every signing step executes ONLY when its secrets are configured;
  #    otherwise it logs "signing skipped: certificate not configured" and
  #    the unsigned artifacts still build, checksum, SBOM, and upload — a
  #    release can be staged before any certificate exists.
  #  - Certificate injection point: once the certificates/keys exist, only
  #    the repository secrets below need to be set — no changes to this file
  #    are required. The scripts (scripts/sign-windows.ps1,
  #    scripts/sign-macos.sh, scripts/sign-linux.sh) are the local half of
  #    the pipeline: they fail loudly on a missing env, so a mis-wired secret
  #    fails the step instead of silently producing an unsigned artifact.
  #    GitHub secrets are strings, never files, while the scripts consume
  #    FILE PATHS — so the file-shaped material (PFX, App Store Connect .p8,
  #    minisign secret key) is stored base64-encoded in the RUTILUS_*_B64
  #    secrets and decoded to $RUNNER_TEMP by the "Materialize ..." steps
  #    below (H4 audit MINOR 4). Only the Windows thumbprint mode needs no
  #    material at all. Secrets consumed here:
  #      RUTILUS_WINDOWS_CERT_B64 / RUTILUS_WINDOWS_CERT_PASSWORD (PFX,
  #        base64-encoded) or RUTILUS_WINDOWS_CERT_THUMBPRINT (installed
  #        store, no materialization)
  #      RUTILUS_MAC_CERT_ID, RUTILUS_NOTARY_KEY_ID, RUTILUS_NOTARY_KEY_B64
  #        (base64-encoded .p8), RUTILUS_NOTARY_TEAM_ID
  #      RUTILUS_LINUX_SIGN_KEY_B64 (base64-encoded minisign secret key),
  #        and optionally RUTILUS_LINUX_SIGN_PASSWORD
  release-artifacts:
    name: Release artifacts (${{ matrix.suffix }})
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    needs: [ci, wasm-gate]
    env:
      # §5.4 build-result embedding — same contract as the ci job: the exact
      # commit actions/checkout checked out. Without it the release binaries
      # would silently embed the `dev` fallback instead (app/src/main.rs)
      # (H4 audit MINOR 1).
      RUTILUS_GIT_COMMIT: ${{ github.sha }}
      # Sign-material presence flags (W3S-10, 2026-08-13): step-level `if:`
      # conditions cannot reference `secrets` directly (GitHub Actions
      # restriction: Unrecognized named-value: 'secrets'), and a step's own
      # `env` is evaluated only when the step RUNS, so it is not visible to
      # the step's `if:` — job-level env is the only presence signal the
      # guards can read. The job-level mappings therefore carry ONLY the
      # presence of each secret (`true`/`false` strings, evaluated at job
      # start), never the secret value: the raw material (PFX, .p8, minisign
      # key) is confined to the materialize/sign steps, which re-declare
      # their secrets at step level below, and no other step of the job —
      # checkout, builds, staging, checksums — holds the signing secrets in
      # its process environment. Absent secrets evaluate to the empty
      # string, so the flags are exactly as reliable as the former
      # `env.<NAME> != ''` guards they replace.
      RUTILUS_WINDOWS_CERT_B64_CONFIGURED: ${{ secrets.RUTILUS_WINDOWS_CERT_B64 != '' }}
      RUTILUS_WINDOWS_CERT_THUMBPRINT_CONFIGURED: ${{ secrets.RUTILUS_WINDOWS_CERT_THUMBPRINT != '' }}
      RUTILUS_MAC_CERT_ID_CONFIGURED: ${{ secrets.RUTILUS_MAC_CERT_ID != '' }}
      RUTILUS_NOTARY_KEY_ID_CONFIGURED: ${{ secrets.RUTILUS_NOTARY_KEY_ID != '' }}
      RUTILUS_NOTARY_KEY_B64_CONFIGURED: ${{ secrets.RUTILUS_NOTARY_KEY_B64 != '' }}
      RUTILUS_NOTARY_TEAM_ID_CONFIGURED: ${{ secrets.RUTILUS_NOTARY_TEAM_ID != '' }}
      RUTILUS_LINUX_SIGN_KEY_B64_CONFIGURED: ${{ secrets.RUTILUS_LINUX_SIGN_KEY_B64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # §5.2 release matrix; build shapes mirror the ci job's release
          # steps (musl static / zigbuild aarch64 musl / MSVC x64 / macOS
          # Universal 2 via lipo).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-x86_64-musl
            binary_path: target/x86_64-unknown-linux-musl/release/rutilus
            sbom: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: linux-aarch64-musl
            binary_path: target/aarch64-unknown-linux-musl/release/rutilus
            zigbuild: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            binary_path: target/x86_64-pc-windows-msvc/release/rutilus.exe
          - os: macos-latest
            target: universal-apple-darwin
            suffix: macos-universal
            binary_path: target/universal-apple-darwin/release/rutilus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # tag v4

      # The toolchain comes exclusively from rust-toolchain.toml (same policy
      # as the ci job); targets are added inside the build steps below.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # tag stable (moving; pinned 2026-08-05)

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # tag v2 (2.9.2)

      # cargo-zigbuild is only the Cargo driver for the aarch64 musl
      # cross-link, using the same install-action input contract as the ci
      # job (`tool`, singular). The Zig compiler is installed independently
      # below; neither tool is assumed to exist on the runner image.
      - name: Install cargo-zigbuild (aarch64)
        if: matrix.zigbuild
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20  # tag v2 (2.85.12)
        with:
          tool: cargo-zigbuild@0.22.3

      - name: Install Zig compiler (aarch64)
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # tag v2.2.1
        with:
          version: 0.14.1

      - name: Build linux release binary (musl static)
        if: ${{ runner.os == 'Linux' && !matrix.zigbuild }}
        run: |
          rustup target add x86_64-unknown-linux-musl
          # musl-gcc, which ring and libsqlite3-sys need for the musl
          # cross-link, is not on the hosted image — same apt line as the ci
          # job's musl step (H4 audit BLOCKER 1).
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked -p rutilus --target x86_64-unknown-linux-musl --release

      - name: Build linux release binary (aarch64 musl static)
        if: ${{ runner.os == 'Linux' && matrix.zigbuild }}
        run: |
          rustup target add aarch64-unknown-linux-musl
          zig version
          cargo zigbuild --locked -p rutilus --target aarch64-unknown-linux-musl --release

      - name: Build windows release binary (MSVC x64)
        if: ${{ runner.os == 'Windows' }}
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --locked -p rutilus --target x86_64-pc-windows-msvc --release

      # Mirror of the ci job's Universal 2 step, including the audit-A4
      # arch verification (lipo -info / lipo -verify_arch). Same argument
      # order as the ci job step: the binary must precede -verify_arch
      # (lipo eats every argument after the flag as arch types).
      - name: Build macOS Universal 2 release binary
        if: ${{ runner.os == 'macOS' }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked -p rutilus --target aarch64-apple-darwin --release
          cargo build --locked -p rutilus --target x86_64-apple-darwin --release
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/rutilus \
            target/aarch64-apple-darwin/release/rutilus \
            target/x86_64-apple-darwin/release/rutilus
          lipo -info target/universal-apple-darwin/release/rutilus
          lipo target/universal-apple-darwin/release/rutilus -verify_arch x86_64 arm64

      # Version-qualified artifact name: on a tag push github.ref_name is the
      # tag (v1.0.0) -> rutilus-v1.0.0-<suffix>; on workflow_dispatch it is
      # the branch name. `release/` is the staging dir for checksums,
      # signing, and upload.
      #
      # Boundary: a `github.ref_name` containing `/` — a `v1.0/rc1`-style tag
      # or a `release/0.9`-style dispatch branch — breaks the stage/upload
      # (`cp` into a missing parent dir; upload-artifact artifact names may
      # not contain `/`): a visible failure, not a silent one. The release
      # path promises the slash-free `v*` tag convention; on workflow_dispatch
      # use a slash-free branch name or accept the failure. No sanitize, by
      # design.
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp ${{ matrix.binary_path }} release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}

      # --- Windows Authenticode (certificate injection point: set the
      # RUTILUS_WINDOWS_CERT_* secrets) -------------------------------------
      # Guarded on the certificate material itself (PFX or thumbprint), not
      # the password: a password without a certificate cannot sign anything,
      # so it alone must not gate the step.
      - name: Materialize Windows signing certificate (PFX)
        if: ${{ runner.os == 'Windows' && env.RUTILUS_WINDOWS_CERT_B64_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          RUTILUS_WINDOWS_CERT_B64: ${{ secrets.RUTILUS_WINDOWS_CERT_B64 }}
        run: |
          # GitHub secrets are strings, never files, but sign-windows.ps1
          # consumes a FILE PATH: decode the base64 PFX into $RUNNER_TEMP
          # (per-job, wiped after the run) and the Sign step points at it.
          $pfxPath = Join-Path $env:RUNNER_TEMP 'rutilus-windows-cert.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String(($env:RUTILUS_WINDOWS_CERT_B64 -replace '\s', '')))
      - name: Sign (Windows Authenticode)
        if: ${{ runner.os == 'Windows' && (env.RUTILUS_WINDOWS_CERT_B64_CONFIGURED == 'true' || env.RUTILUS_WINDOWS_CERT_THUMBPRINT_CONFIGURED == 'true') }}
        shell: pwsh
        env:
          # Empty in thumbprint-only mode — the script then ignores the PFX
          # and never demands its password (sign-windows.ps1 requires the
          # password whenever the PATH is set).
          RUTILUS_WINDOWS_CERT_PATH: ${{ secrets.RUTILUS_WINDOWS_CERT_B64 != '' && format('{0}/rutilus-windows-cert.pfx', runner.temp) || '' }}
          RUTILUS_WINDOWS_CERT_PASSWORD: ${{ secrets.RUTILUS_WINDOWS_CERT_PASSWORD }}
          RUTILUS_WINDOWS_CERT_THUMBPRINT: ${{ secrets.RUTILUS_WINDOWS_CERT_THUMBPRINT }}
        run: ./scripts/sign-windows.ps1 release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}

      # --- macOS Developer ID + notarization (certificate injection point:
      # set the RUTILUS_MAC_CERT_ID and RUTILUS_NOTARY_* secrets) ------------
      - name: Materialize notary API key (.p8)
        if: ${{ runner.os == 'macOS' && env.RUTILUS_NOTARY_KEY_B64_CONFIGURED == 'true' }}
        env:
          RUTILUS_NOTARY_KEY_B64: ${{ secrets.RUTILUS_NOTARY_KEY_B64 }}
        run: |
          # notarytool --key consumes a FILE PATH; decode the base64 .p8
          # into $RUNNER_TEMP. `base64 -D` is the macOS decode flag (GNU's
          # `-d` is the Linux-only spelling); `tr -d '[:space:]'` tolerates
          # any line-wrapping in the stored base64.
          printf '%s' "$RUTILUS_NOTARY_KEY_B64" | tr -d '[:space:]' | base64 -D > "$RUNNER_TEMP/rutilus-notary-key.p8"
      - name: Sign (macOS Developer ID)
        if: ${{ runner.os == 'macOS' && env.RUTILUS_MAC_CERT_ID_CONFIGURED == 'true' }}
        env:
          RUTILUS_MAC_CERT_ID: ${{ secrets.RUTILUS_MAC_CERT_ID }}
        run: bash scripts/sign-macos.sh release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}

      # Notarization additionally requires the signed binary (ditto zips the
      # staged artifact), hence the MAC_CERT_ID guard on top of the notary
      # secrets.
      - name: Notarize and staple (macOS)
        if: ${{ runner.os == 'macOS' && env.RUTILUS_MAC_CERT_ID_CONFIGURED == 'true' && env.RUTILUS_NOTARY_KEY_ID_CONFIGURED == 'true' && env.RUTILUS_NOTARY_KEY_B64_CONFIGURED == 'true' && env.RUTILUS_NOTARY_TEAM_ID_CONFIGURED == 'true' }}
        env:
          RUTILUS_NOTARY_KEY_ID: ${{ secrets.RUTILUS_NOTARY_KEY_ID }}
          RUTILUS_NOTARY_KEY: ${{ secrets.RUTILUS_NOTARY_KEY_B64 != '' && format('{0}/rutilus-notary-key.p8', runner.temp) || '' }}
          RUTILUS_NOTARY_TEAM_ID: ${{ secrets.RUTILUS_NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }} release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}.zip
          bash scripts/sign-macos.sh --notarize release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}.zip release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}

      # --- Linux independent signing, minisign (certificate injection point:
      # set the RUTILUS_LINUX_SIGN_KEY_B64 secret) ----------------------------
      # minisign is packaged in Ubuntu universe (apt) and Homebrew. The
      # choice of minisign over gpg is documented in scripts/sign-linux.sh.
      - name: Materialize Linux signing key (minisign)
        if: ${{ runner.os == 'Linux' && env.RUTILUS_LINUX_SIGN_KEY_B64_CONFIGURED == 'true' }}
        env:
          RUTILUS_LINUX_SIGN_KEY_B64: ${{ secrets.RUTILUS_LINUX_SIGN_KEY_B64 }}
        run: |
          # minisign -s consumes a FILE PATH; decode the base64 secret key
          # into $RUNNER_TEMP (GNU base64 -d; tr strips any line-wrapping).
          printf '%s' "$RUTILUS_LINUX_SIGN_KEY_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/rutilus-linux-sign.key"
      - name: Install minisign
        if: ${{ runner.os == 'Linux' && env.RUTILUS_LINUX_SIGN_KEY_B64_CONFIGURED == 'true' }}
        run: |
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y minisign
          fi
      - name: Sign (Linux, minisign detached)
        if: ${{ runner.os == 'Linux' && env.RUTILUS_LINUX_SIGN_KEY_B64_CONFIGURED == 'true' }}
        env:
          RUTILUS_LINUX_SIGN_KEY: ${{ secrets.RUTILUS_LINUX_SIGN_KEY_B64 != '' && format('{0}/rutilus-linux-sign.key', runner.temp) || '' }}
          RUTILUS_LINUX_SIGN_PASSWORD: ${{ secrets.RUTILUS_LINUX_SIGN_PASSWORD }}
        run: bash scripts/sign-linux.sh release/rutilus-${{ github.ref_name }}-${{ matrix.suffix }}

      # Visible skip marker so the log shows the absence of a certificate is
      # intentional, not an error. MUST stay a single-line expression: a
      # block-scalar `if:` evaluates the literal multi-line string, which is
      # non-empty and therefore always true (github/docs#6508) — the step
      # would lie "skipped" even after a successful signing (H4 audit
      # MINOR 3). Fires only when NO certificate material for this runner's
      # OS is configured; on macOS the notary key alone cannot sign, so
      # MAC_CERT_ID stays the sign-mode indicator.
      - name: Signing skipped (no certificate configured)
        if: ${{ (runner.os == 'Windows' && env.RUTILUS_WINDOWS_CERT_B64_CONFIGURED == 'false' && env.RUTILUS_WINDOWS_CERT_THUMBPRINT_CONFIGURED == 'false') || (runner.os == 'macOS' && env.RUTILUS_MAC_CERT_ID_CONFIGURED == 'false') || (runner.os == 'Linux' && env.RUTILUS_LINUX_SIGN_KEY_B64_CONFIGURED == 'false') }}
        run: 'echo "signing skipped: certificate not configured"'

      # --- SBOM (workspace-wide; generated once on the x86_64 linux job) ----
      # cargo-cyclonedx (pinned to 0.5.9, the latest stable on crates.io as
      # of 2026-08-12) from taiki-e/install-action, same pattern as the ci
      # job's gate tools. Real CLI: the only subcommand is `cargo cyclonedx`
      # — there is NO --locked and NO --output-dir. The tool writes one
      # <package>.cdx.json into EVERY workspace member's own directory — one
      # per Cargo.toml dir, e.g. api/rutilus-api.cdx.json and
      # app/rutilus.cdx.json (the virtual workspace root has no [package],
      # hence no output). Filename and per-crate layout verified by a local
      # trial run on 2026-08-12 (cargo-cyclonedx 0.5.9, Windows; the naming
      # is baked into the tool, platform-independent); the ubuntu CI first
      # run remains the confirmation point. The step therefore collects the
      # 15 per-crate BOMs under release/ with crate-qualified names, and the
      # find keeps its existing exclusions of ./target/ and ./release/ so
      # only the freshly generated per-crate files are picked up. `--all`
      # lists every dependency (it is the default; kept explicit).
      #
      # Lock consistency (F4-5, 2026-08-13): because cargo-cyclonedx has no
      # --locked, the step first asserts the committed Cargo.lock is up to
      # date with a `cargo metadata --locked` run; the SBOM then documents
      # exactly the locked graph the release binaries were built from (the
      # build steps above all use --locked). --no-dev-deps was evaluated and
      # does NOT exist in cargo-cyclonedx 0.5.9 — the only related flag is
      # --no-build-deps, which would drop build-time components (prost-build
      # etc.) the release binaries genuinely require at build time, so it is
      # deliberately NOT used. Dev-dependencies therefore stay in the
      # workspace-wide SBOM by design (a repo inventory, not a link-time
      # manifest); revisit the flag set when cargo-cyclonedx is upgraded.
      - name: Install cargo-cyclonedx
        if: matrix.sbom
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20  # tag v2 (2.85.12)
        with:
          # `tool` (singular) — `tools` is not a declared install-action
          # input and is silently ignored (see the ci job's Install gate
          # tools step).
          tool: cargo-cyclonedx@0.5.9
      - name: Generate SBOM (CycloneDX JSON)
        if: matrix.sbom
        run: |
          # cargo-cyclonedx has no --locked (see the step comment above), so
          # assert the committed Cargo.lock is up to date first; fails the
          # step if manifests and lockfile have drifted.
          cargo metadata --locked --format-version 1 > /dev/null
          cargo cyclonedx --format json --all
          # One <package>.cdx.json per workspace member crate (every
          # Cargo.toml dir is a unique top-level name, so the parent dir
          # identifies the crate; the virtual workspace root has no
          # [package], hence no BOM).
          mkdir -p release
          find . -name '*.cdx.json' -not -path './target/*' -not -path './release/*' | sort | while read -r f; do
            mv "$f" "release/rutilus-${{ github.ref_name }}-sbom-$(basename "$(dirname "$f")").json"
          done
          ls -1 release/rutilus-${{ github.ref_name }}-sbom-*.json

      # SHA-256 manifest over everything staged in release/ (binary + any
      # signatures + SBOM + notarization zip). Generated last so the glob
      # does not include the manifest itself.
      - name: Generate SHA-256 manifest
        shell: bash
        run: bash scripts/checksums.sh -o release/SHA256SUMS release/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # tag v4
        with:
          name: rutilus-${{ github.ref_name }}-${{ matrix.suffix }}
          path: release/
          if-no-files-found: error

      # SBOMs are workspace-level artifacts; upload them under their own
      # artifact so they are not buried in the linux-x86_64 bundle.
      - name: Upload SBOM
        if: matrix.sbom
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # tag v4
        with:
          name: rutilus-${{ github.ref_name }}-sbom
          path: release/rutilus-${{ github.ref_name }}-sbom-*.json
          if-no-files-found: error
  # Fast-feedback copy of the wasm gate: the in-job step sits behind ~30
  # minutes of test/cov steps. This job has no test dependencies and
  # surfaces the same comparison (plus forensics and the diagnostics
  # artifact) about eight minutes into a run. It must track the canonical
  # step above.
  wasm-gate:
    name: Wasm UI artifact gate (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # tag v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # tag stable (moving; pinned 2026-08-05)
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # tag v2
      - name: Build and compare wasm32 UI artifact
        run: |

          rustup target add wasm32-unknown-unknown
          # rust-src keeps the std panic locations in the local sysroot form
          # instead of /rustc/<hash>/library/... (a host-independent class).
          rustup component add rust-src \
            --toolchain "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          curl -L --fail \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-bindgen.tgz
          echo "064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d  /tmp/wasm-bindgen.tgz" | sha256sum -c -
          mkdir -p target/rutilus-tools
          tar -xzf /tmp/wasm-bindgen.tgz -C target/rutilus-tools --strip-components=1
          RUSTFLAGS="--remap-path-prefix=$HOME=.cargo-home --remap-path-prefix=$PWD=." \
            cargo build --locked -p rutilus-ui --target wasm32-unknown-unknown --release
          target/rutilus-tools/wasm-bindgen --target web --no-typescript \
            --out-dir target/wasm-assets --out-name rutilus_ui \
            target/wasm32-unknown-unknown/release/rutilus_ui.wasm
          mkdir -p target/wasm-compare
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' \
            target/wasm-assets/rutilus_ui.js > target/wasm-compare/generated-rutilus_ui.js
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' \
            web/assets/rutilus_ui.js > target/wasm-compare/committed-rutilus_ui.js
          # Normalize the registered host-path classes in the wasm pair
          # (.cargo-home segments, ui\src / ui/src prefixes, the host
          # toolchain triple) before the byte comparison; anything outside
          # the classes still fails the gate.
          python3 - <<'PYEOF'
          import re
          def normalize(src, dst):
              data = open(src, 'rb').read()
              out = []
              for seg in data.split(b'\x00'):
                  if b'.cargo-home' in seg or seg.startswith(b'ui\\src') or seg.startswith(b'ui/src'):
                      seg = seg.replace(b'\\', b'/')
                      seg = re.sub(rb'1\.97\.1-[^/]*', b'1.97.1-toolchain', seg)
                  out.append(seg)
              open(dst, 'wb').write(b'\x00'.join(out))
          normalize('target/wasm-assets/rutilus_ui_bg.wasm', 'target/wasm-compare/generated-rutilus_ui_bg.wasm')
          normalize('web/assets/rutilus_ui_bg.wasm', 'target/wasm-compare/committed-rutilus_ui_bg.wasm')
          PYEOF
          if diff -q target/wasm-compare/generated-rutilus_ui.js target/wasm-compare/committed-rutilus_ui.js \
              && diff -q target/wasm-compare/generated-rutilus_ui_bg.wasm target/wasm-compare/committed-rutilus_ui_bg.wasm; then
            echo "wasm UI artifacts match the checked-in files"
          else
            echo "wasm UI artifacts DIFFER from the checked-in files"
            # Bash-only forensics: sizes, sha256s, first differing bytes of
            # each pair, and the string-set diff of the two wasm sides.
            for f in target/wasm-compare/generated-rutilus_ui.js target/wasm-compare/committed-rutilus_ui.js \
                     target/wasm-compare/generated-rutilus_ui_bg.wasm target/wasm-compare/committed-rutilus_ui_bg.wasm; do
              echo "$f: $(wc -c < "$f") bytes, sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            done
            for pair in "js target/wasm-compare/generated-rutilus_ui.js target/wasm-compare/committed-rutilus_ui.js" \
                        "wasm target/wasm-compare/generated-rutilus_ui_bg.wasm target/wasm-compare/committed-rutilus_ui_bg.wasm"; do
              set -- $pair; name="$1"; a="$2"; b="$3"
              echo "$name first differing bytes (offset byte-a byte-b, octal):"
              cmp -l "$a" "$b" 2>/dev/null | head -6 || echo "  (no common prefix)"
              off=$(cmp "$a" "$b" 2>&1 | sed -n 's/.*differ: byte \([0-9][0-9]*\).*/\1/p')
              if [ -n "$off" ]; then
                start=$((off > 32 ? off - 32 : 1))
                echo "  generated @byte $start: $(dd if="$a" bs=1 skip=$((start - 1)) count=96 2>/dev/null | tr -c '[:print:]' '.')"
                echo "  committed @byte $start: $(dd if="$b" bs=1 skip=$((start - 1)) count=96 2>/dev/null | tr -c '[:print:]' '.')"
              fi
            done
            echo "embedded string sets, committed-only lines (<) and generated-only lines (>):"
            strings -a target/wasm-compare/committed-rutilus_ui_bg.wasm | sort -u > target/wasm-compare/com-strings.txt
            strings -a target/wasm-compare/generated-rutilus_ui_bg.wasm | sort -u > target/wasm-compare/gen-strings.txt
            diff target/wasm-compare/com-strings.txt target/wasm-compare/gen-strings.txt | head -40 || true
            touch target/wasm-compare/mismatch.marker
            exit 1
          fi

      # Same marker contract as the in-job upload step.
      - name: Upload CI-generated wasm assets (diagnostics)
        if: ${{ always() && hashFiles('target/wasm-compare/mismatch.marker') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # tag v4
        with:
          name: wasm-assets-ci-generated-${{ github.run_id }}
          path: |
            target/wasm-compare/mismatch.marker
            target/wasm-assets/rutilus_ui.js
            target/wasm-assets/rutilus_ui_bg.wasm
          if-no-files-found: ignore
