[package]
name = "rutilus-infra-redfish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The `update-service-deprecated` feature gates the upstream `HttpPushUri`
# raw-binary upload surface (`HttpPushUriUpdateRequest`/`Bmc::http_push_uri_update`).
# §0.4.0 requires "上游保留的 Legacy Update 兼容" and §14.3 chooses between
# multipart and the endpoint's public push interface, so the deprecated
# upload surface is compiled in with the rest of the 0.13.0 baseline.
nv-redfish = { workspace = true, features = ["update-service-deprecated"] }
futures-util = { version = "0.3.32", features = ["io"] }
reqwest.workspace = true
rutilus-application.workspace = true
rutilus-domain.workspace = true
rutilus-operation-engine.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 for the release-baseline capability-ledger hash snapshot (§2.3,
# §15.3): the freeze record re-implements the negotiation digest locally so
# it does not depend on the center-protocol crate.
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
# `CancellationToken` (§7.8: every long-lived connection has a cancellation
# token) is available without tokio-util features in 0.7.
tokio-util = { version = "0.7.19", default-features = false }

[dev-dependencies]
rcgen.workspace = true
url.workspace = true

[lints]
workspace = true
