[package]
name = "rutilus-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
csv.workspace = true
futures.workspace = true
rutilus-center-protocol.workspace = true
rutilus-domain.workspace = true
rutilus-operation-engine.workspace = true
rutilus-security.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde-well-known"] }
tokio.workspace = true
# The deterministic receipt key of a reply whose wire operation id is not a
# UUID (R6-E-08): the raw id cannot key a `center_inbox` receipt directly,
# so the key is a UUID v5 of the raw string.
uuid = { workspace = true, features = ["v5"] }
# §6.2 diagnostic logging: the center-sync engine records operational
# failures and absorbed protocol anomalies through tracing::error!/warn!.
tracing.workspace = true

[dev-dependencies]
# The through-path decode-failure tests (§12.4 / known-limitations §九) drive
# the production refresh pipeline against the real persistence store: the
# captured records must land in `resource_decode_failures` through the
# same-generation commit, which only a real `SqliteStore` exercises.
rutilus-persistence.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
